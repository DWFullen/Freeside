# Dependabot version updates (AGENTS.md §7.4).
# - New releases wait 7 days (cooldown) before Dependabot proposes them: most
#   compromised releases are pulled within days. Security updates skip the wait.
# - Terraform (/infra) is added by the PR that creates that directory (Phase 0
#   PR 8a).
# - NuGet PRs may need their lock files refreshed; see README, "Dependabot PRs".
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # global.json. A new SDK major (for example .NET 11) is a decision, not a bump.
  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # tools/regtest/compose.yml: images pinned as tag@digest; both are updated.
  # The BTCPay stack must match what the operator's Start9 node runs (ADR 0013),
  # so it is re-pinned by hand when that package is updated, never by
  # Dependabot. A Postgres major is a decision (#13), not a bump.
  - package-ecosystem: docker-compose
    directory: "/tools/regtest"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "btcpayserver/*"
      - dependency-name: "nicolasdorier/nbxplorer"
      - dependency-name: "postgres"
        update-types: [version-update:semver-major]
