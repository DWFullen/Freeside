name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Testcontainers' reaper container is pulled by tag; runners are thrown
      # away after the job, so it isn't needed here.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: EF model matches the migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Freeside.Infrastructure --configuration Release --no-build

      # Regtest tests need the docker stack; the regtest job runs them. The
      # Infrastructure tests start Postgres with Testcontainers (Docker is on the runner).
      - name: Test
        run: dotnet test --no-build -c Release --filter-not-trait "Category=Regtest"

  regtest:
    name: regtest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Start the regtest stack
        run: make regtest-up

      - name: Smoke test
        run: make regtest-test

      # Regtest only: nothing in these logs is real (throwaway xpub, addresses, coins).
      - name: Stack logs
        if: failure()
        run: docker compose -f tools/regtest/compose.yml logs --no-color --tail 200

      - name: Stop the regtest stack
        if: always()
        run: make regtest-down

  repo-checks:
    name: repo-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: Shellcheck
        run: shellcheck tools/ci/*.sh tools/ci/tests/*.sh tools/claude-cloud/*.sh tools/regtest/*.sh

      - name: Actions pinned by commit SHA
        run: tools/ci/check-action-pins.sh

      - name: Compose images pinned by digest
        run: tools/ci/check-image-pins.sh

      - name: Placeholders match docs/plans/placeholders.md
        run: tools/ci/check-placeholders.sh

      - name: Repo-check fixture tests
        run: tools/ci/tests/run.sh
